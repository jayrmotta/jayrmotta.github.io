baseURL = "https://jayrmotta.github.io/"
title = "Jayr Motta"
theme = "terminal"

pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 1
  fullWidthTheme = false
  centerTheme = true

[languages]
  [languages.en]
    title = "Jayr Motta"
    [languages.en.params]
      subtitle = "blog"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      menuMore = "Show more"
      [languages.en.params.logo]
        logoText = "Jayr Motta"
        logoHomeLink = "/"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
